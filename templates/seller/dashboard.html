<!DOCTYPE html>
<html>
<head>
    <title>Seller Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="d-flex">
    
    <!-- Sidebar -->
    <div class="bg-dark text-white p-3" style="width: 250px; min-height: 100vh;">
        <h4 class="text-center">{{ seller.store_name }}</h4>
        <hr>
        <a href="{% url 'product_list' %}" class="text-white d-block mb-2">Products</a>
        <a href="{% url 'seller_logout' %}" class="text-white d-block">Logout</a>
    </div>

    <!-- Main Content -->
    <div class="p-4 flex-grow-1">
        <h2>Welcome, {{ seller.store_name }}</h2>
        <p>Total Products: <b>{{ product_count }}</b></p>

        <a href="{% url 'product_list' %}" class="btn btn-primary">Go to Product Management</a>
    </div>

</div>

</body>
</html>
