<!DOCTYPE html>
<html>
<head>
    <title>Manage Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-5">
    <h2>Product List</h2>
    <a href="{% url 'product_add' %}" class="btn btn-success mb-3">+ Add Product</a>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Active</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {% for product in products %}
            <tr>
                <td>{{ product.name }}</td>
                <td>{{ product.category }}</td>
                <td>₹{{ product.price }}</td>
                <td>{{ product.stock_quantity }}</td>
                <td>{{ product.is_active }}</td>

                <td>
                    <a href="{% url 'product_edit' product.id %}" class="btn btn-warning btn-sm">Edit</a>
                    <a href="{% url 'product_delete' product.id %}" class="btn btn-danger btn-sm">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="6" class="text-center">No products found.</td></tr>
            {% endfor %}
        </tbody>
    </table>

</div>
</body>
</html>
