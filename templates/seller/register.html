<!DOCTYPE html>
<html>
<head>
    <title>Seller Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 mx-auto" style="max-width: 500px;">
        <h3 class="text-center mb-3">Seller Registration</h3>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label>Username</label>
                <input name="username" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input name="email" type="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input name="password" type="password" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Confirm Password</label>
                <input name="confirm_password" type="password" class="form-control" required>
            </div>

            <hr>

            <h5 class="mb-3">Store Details</h5>

            <div class="mb-3">
                <label>Store Name</label>
                <input name="store_name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Store Description</label>
                <textarea name="store_description" class="form-control"></textarea>
            </div>

            <button class="btn btn-primary w-100">Create Seller Account</button>

        </form>

        <div class="text-center mt-3">
            Already have an account? 
            <a href="{% url 'seller_login' %}">Login here</a>
        </div>

        {% if messages %}
            {% for msg in messages %}
                <p class="text-danger text-center mt-3">{{ msg }}</p>
            {% endfor %}
        {% endif %}

    </div>
</div>

</body>
</html>
